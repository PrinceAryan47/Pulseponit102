<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Authentication - PulsePoint</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #0f172a;
      color: #f8fafc;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 24px;
      padding: 40px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5), 0 8px 10px -6px rgb(0 0 0 / 0.5);
    }
    .loader {
      border: 4px solid #334155;
      border-top: 4px solid #06b6d4;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      animation: spin 1s linear infinite;
      margin: 0 auto 24px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    .sub-status {
      font-size: 14px;
      color: #94a3b8;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 14px 28px;
      background-color: #06b6d4;
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(6, 182, 212, 0.3);
    }
    .btn:hover {
      background-color: #22d3ee;
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>
  <div class="card">
    <div id="spinner" class="loader"></div>
    <div id="status" class="status">Connecting to Google...</div>
    <div id="sub-status" class="sub-status">Please complete the sign-in in the Google window to authenticate.</div>
    <button id="retry-btn" class="btn" style="display: none;" onclick="triggerSignIn()">Try Again</button>
  </div>

  <!-- Import Firebase modules from CDN -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, browserLocalPersistence, setPersistence } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-auth.js";

    // Same Firebase configuration as client
    const firebaseConfig = {
      "projectId": "gen-lang-client-0932215682",
      "appId": "1:26521095497:web:51b5b4bd7291137b5c9e98",
      "apiKey": "AIzaSyA1m2EIC4VVV9fO3r1KFMPa-j0GIdgq1WU",
      "authDomain": "gen-lang-client-0932215682.firebaseapp.com",
      "storageBucket": "gen-lang-client-0932215682.firebasestorage.app",
      "messagingSenderId": "26521095497"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    // Force prompt to ensure account selection
    provider.setCustomParameters({
      prompt: 'select_account'
    });

    window.triggerSignIn = async () => {
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('retry-btn').style.display = 'none';
      document.getElementById('status').innerText = 'Authenticating with Google...';
      document.getElementById('sub-status').innerText = 'A Google window should have opened. Please sign in to authorize your account.';

      try {
        // Enforce Local Persistence so the shared origin registers the login state
        await setPersistence(auth, browserLocalPersistence);
        
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        document.getElementById('spinner').style.display = 'none';
        document.getElementById('status').innerText = 'Authentication Successful!';
        document.getElementById('sub-status').innerText = 'Syncing authentication state with PulsePoint. This window will close shortly...';

        // Post result back to parent window
        if (window.opener) {
          window.opener.postMessage({ 
            type: 'FIREBASE_AUTH_SUCCESS',
            uid: user.uid,
            email: user.email,
            displayName: user.displayName,
            photoURL: user.photoURL,
            phoneNumber: user.phoneNumber || ''
          }, window.location.origin);
          
          setTimeout(() => {
            window.close();
          }, 1200);
        } else {
          document.getElementById('status').innerText = 'Authentication Complete!';
          document.getElementById('sub-status').innerText = 'You can now close this window and return to PulsePoint.';
        }
      } catch (err) {
        console.error("Auth error inside popup:", err);
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('retry-btn').style.display = 'block';
        document.getElementById('status').innerText = 'Authentication Failed';
        document.getElementById('sub-status').innerText = err.message || 'Please click the button to try again.';
      }
    };

    // Auto trigger on load
    window.triggerSignIn();
  </script>
</body>
</html>
